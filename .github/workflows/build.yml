name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows · JDK 21 · build.bat and test.bat
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: cmd
        run: call build.bat

      # The Windows runner has a desktop session, so the Swing tests really run
      # here rather than skipping themselves.
      - name: Test
        shell: cmd
        run: call test.bat

  linux:
    name: Linux · JDK 17 · javac and java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 is the version the README claims as the minimum, so build it here to
      # keep that promise honest.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile the application
        run: |
          find src/main/java -name '*.java' > sources.txt
          javac -d build/classes -cp lib/sqlite-jdbc-3.50.3.0.jar @sources.txt

      - name: Compile the tests
        run: |
          find src/test/java -name '*.java' > testsources.txt
          javac -d build/testclasses \
                -cp "build/classes:lib/sqlite-jdbc-3.50.3.0.jar" @testsources.txt

      # Without a display the Swing suite would skip itself, so give it a
      # virtual one and run the whole thing for real.
      - name: Run the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a java -cp "build/testclasses:build/classes:lib/sqlite-jdbc-3.50.3.0.jar" \
            com.library.RunTests

      - name: Check the app starts and seeds its database
        run: |
          xvfb-run -a timeout 30s java \
            -cp "build/classes:lib/sqlite-jdbc-3.50.3.0.jar" com.library.Main --help
